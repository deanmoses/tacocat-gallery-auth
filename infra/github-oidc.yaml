AWSTemplateFormatVersion: '2010-09-09'
Description: >-
    IAM roles that the tacocat-gallery-auth GitHub Actions workflows assume, and
    the CloudFormation service role that deploys the stacks. Deployed by hand,
    never by CI: CI cannot be the thing that creates its own credentials.
    See infra/README.md.

# -----------------------------------------------------------------------------
# How the pieces fit together
#
#   GitHub Actions job ──(OIDC token)──▶ tacocat-gallery-auth-cicd-github-{pr,main,prod}
#                                              │
#                                              │ iam:PassRole + cloudformation:*ChangeSet
#                                              ▼
#                                    tacocat-gallery-auth-cicd-cloudformation
#                                              │
#                                              │ creates/updates every stack resource
#                                              ▼
#                                    tacocat-gallery-auth-{dev,prod} stacks
#
# The three GitHub roles hold only what a `sam deploy` needs from the caller's
# side: upload artifacts, create and (except for the PR role) execute change
# sets on their own stacks, and hand CloudFormation its service role. The broad
# permissions needed to actually create Lambdas, API Gateway domains and so on
# live on the CloudFormation service role, which only CloudFormation can assume.
#
# The GitHub OIDC identity provider the roles trust is account-wide and lives
# in https://github.com/deanmoses/aws-bootstrap.
#
# Which role a job may assume is decided by the GitHub token's `sub` claim:
#
#   repo:ORG/REPO:pull_request          PR role    dry-run change set on dev
#   repo:ORG/REPO:ref:refs/heads/main   main role  deploy dev
#   repo:ORG/REPO:environment:prod      prod role  deploy prod (protected branches only)
# -----------------------------------------------------------------------------

Parameters:
    GitHubOrg:
        Type: String
        Default: deanmoses
        Description: GitHub user or organization that owns the repository
    GitHubRepo:
        Type: String
        Default: tacocat-gallery-auth
        Description: GitHub repository name
    ProdEnvironment:
        Type: String
        Default: prod
        Description: Name of the GitHub environment that gates production deploys
    StackPrefix:
        Type: String
        Default: tacocat-gallery-auth
        Description: Prefix of the application stack names, which are the prefix followed by -dev or -prod. Also the prefix of the IAM roles those stacks create.
    ClaudeCodeCloudUserName:
        Type: String
        Default: tacocat-gallery-claude-code-cloud
        Description: The IAM user a Claude Code on the web session authenticates as. The tacocat-gallery-sam repo's cicd stack creates it, so that stack has to exist before this one deploys; here it is only attached to.
    SamArtifactBucket:
        Type: String
        Default: aws-sam-cli-managed-default-samclisourcebucket-7tmt1e3o0r12
        Description: The S3 bucket `sam deploy --resolve-s3` uploads build artifacts to (SourceBucket output of the aws-sam-cli-managed-default stack)

Resources:
    # ---------------------------------------------------------------------------
    # CloudFormation service role: does the actual resource creation
    # ---------------------------------------------------------------------------
    CloudFormationDeployRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-auth-cicd-cloudformation
            Description: Service role CloudFormation assumes to deploy the tacocat-gallery-auth stacks
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudformation.amazonaws.com
                      Action: sts:AssumeRole
                      Condition:
                          StringEquals:
                              aws:SourceAccount: !Ref AWS::AccountId
                          ArnLike:
                              aws:SourceArn:
                                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*
                                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*
            Policies:
                - PolicyName: DeployAuthStacks
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          # Everything except identity management, plus identity management
                          # scoped to the roles the application stacks create for their own Lambdas.
                          - Sid: EverythingExceptIdentity
                            Effect: Allow
                            NotAction:
                                - iam:*
                                - organizations:*
                                - account:*
                            Resource: '*'
                          - Sid: RolesOwnedByTheStacks
                            Effect: Allow
                            Action:
                                - iam:CreateRole
                                - iam:DeleteRole
                                - iam:GetRole
                                - iam:UpdateRole
                                - iam:UpdateAssumeRolePolicy
                                - iam:PassRole
                                - iam:AttachRolePolicy
                                - iam:DetachRolePolicy
                                - iam:PutRolePolicy
                                - iam:DeleteRolePolicy
                                - iam:GetRolePolicy
                                - iam:ListRolePolicies
                                - iam:ListAttachedRolePolicies
                                - iam:TagRole
                                - iam:UntagRole
                            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${StackPrefix}-*

    # ---------------------------------------------------------------------------
    # What every GitHub role needs to run `sam deploy` at all
    # ---------------------------------------------------------------------------
    SamDeployPlumbingPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            ManagedPolicyName: tacocat-gallery-auth-cicd-sam-deploy-plumbing
            Description: Upload SAM artifacts, read the SAM managed bucket stack, and pass the CloudFormation service role
            Users:
                - !Ref ClaudeCodeCloudUserName
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: UploadBuildArtifacts
                      Effect: Allow
                      Action:
                          - s3:ListBucket
                          - s3:GetBucketLocation
                      Resource: !Sub arn:aws:s3:::${SamArtifactBucket}
                    - Sid: ReadWriteBuildArtifacts
                      Effect: Allow
                      Action:
                          - s3:GetObject
                          - s3:PutObject
                      Resource: !Sub arn:aws:s3:::${SamArtifactBucket}/*
                    - Sid: FindTheArtifactBucket
                      Effect: Allow
                      Action:
                          - cloudformation:DescribeStacks
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                    - Sid: TemplateInspection
                      Effect: Allow
                      Action:
                          - cloudformation:GetTemplateSummary
                          - cloudformation:ValidateTemplate
                      Resource: '*'
                    - Sid: HandCloudFormationItsRole
                      Effect: Allow
                      Action: iam:PassRole
                      Resource: !GetAtt CloudFormationDeployRole.Arn
                      Condition:
                          StringEquals:
                              iam:PassedToService: cloudformation.amazonaws.com
                    - Sid: SamTransform
                      # Creating a change set for a template with a Transform needs
                      # permission on the transform pseudo-resource too
                      Effect: Allow
                      Action: cloudformation:CreateChangeSet
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

    # ---------------------------------------------------------------------------
    # PR role: pull requests dry-run a change set against the dev stack
    # ---------------------------------------------------------------------------
    GitHubPullRequestRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-auth-cicd-github-pr
            Description: Assumed by pull request workflow runs to validate a change set against the dev stack without executing it
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:pull_request
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
            Policies:
                - PolicyName: DryRunChangeSetOnDev
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:CreateChangeSet
                                - cloudformation:DescribeChangeSet
                                - cloudformation:DeleteChangeSet
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeStackEvents
                                - cloudformation:GetTemplate
                                - cloudformation:ListStackResources
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*

    # ---------------------------------------------------------------------------
    # Main role: pushes to main deploy dev (the staging environment)
    # ---------------------------------------------------------------------------
    GitHubMainRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-auth-cicd-github-main
            Description: Assumed by workflow runs on the main branch to deploy the dev stack
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
            Policies:
                - PolicyName: DeployDev
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:CreateChangeSet
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ExecuteChangeSet
                                - cloudformation:DeleteChangeSet
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeStackEvents
                                - cloudformation:DescribeStackResources
                                - cloudformation:GetTemplate
                                - cloudformation:ListStackResources
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*

    # ---------------------------------------------------------------------------
    # Prod role: only a job running inside the approved `prod` environment
    # ---------------------------------------------------------------------------
    GitHubProdRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-auth-cicd-github-prod
            Description: Assumed by the production deploy job, which runs inside the prod GitHub environment that only deploys from protected branches
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${ProdEnvironment}
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
            Policies:
                - PolicyName: DeployProd
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:CreateChangeSet
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ExecuteChangeSet
                                - cloudformation:DeleteChangeSet
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeStackEvents
                                - cloudformation:DescribeStackResources
                                - cloudformation:GetTemplate
                                - cloudformation:ListStackResources
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*

    # ---------------------------------------------------------------------------
    # Claude Code on the web: deploy dev and read logs, the same reach the main
    # branch's CI role has, plus the logs no CI job needs. The user itself is
    # created by the tacocat-gallery-sam repo, because a cloud session presents
    # one credential for the whole account and so can only have one user; what
    # that user may do *here* is this repo's to decide, and lives in this file.
    # ---------------------------------------------------------------------------
    ClaudeCodeCloudPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            ManagedPolicyName: tacocat-gallery-auth-claude-code-cloud
            Description: Deploy the dev stack and read every environment's logs from a Claude Code on the web session
            Users:
                - !Ref ClaudeCodeCloudUserName
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: DeployDev
                      Effect: Allow
                      Action:
                          - cloudformation:CreateChangeSet
                          - cloudformation:DescribeChangeSet
                          - cloudformation:ExecuteChangeSet
                          - cloudformation:DeleteChangeSet
                          - cloudformation:DescribeStacks
                          - cloudformation:DescribeStackEvents
                          - cloudformation:DescribeStackResources
                          - cloudformation:GetTemplate
                          - cloudformation:ListStackResources
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*
                    - Sid: ReadTheLogs
                      # Reading prod is the point: an incident is the moment you most
                      # want the logs, and reading them cannot change anything. The
                      # group names are fixed strings in template.yaml rather than
                      # derived from the stack name.
                      Effect: Allow
                      Action:
                          - logs:DescribeLogStreams
                          - logs:GetLogEvents
                          - logs:FilterLogEvents
                          - logs:StartLiveTail
                          - logs:StartQuery
                          - logs:StopQuery
                      Resource:
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/dev:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/dev/api-access:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/prod:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/prod/api-access:*
                    - Sid: FindTheLogGroups
                      # `sam logs` lists log groups before reading one, and
                      # GetQueryResults takes a query id rather than a group. Neither
                      # returns log content, so the wildcard costs nothing.
                      Effect: Allow
                      Action:
                          - logs:DescribeLogGroups
                          - logs:GetQueryResults
                          - logs:DescribeQueries
                      Resource: '*'
                    - Sid: NeverProd
                      # Reading prod logs is granted above; changing prod is not, and
                      # nothing else here grants it either. This is so that a later
                      # widening of a shared policy cannot quietly hand production to
                      # a credential that sits in a cloud environment.
                      Effect: Deny
                      Action: cloudformation:*
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*

Outputs:
    CloudFormationDeployRoleArn:
        Description: Pass as --role-arn to sam deploy (set as role_arn in samconfig.toml)
        Value: !GetAtt CloudFormationDeployRole.Arn
    GitHubPullRequestRoleArn:
        Description: role-to-assume for pull request runs
        Value: !GetAtt GitHubPullRequestRole.Arn
    GitHubMainRoleArn:
        Description: role-to-assume for runs on main
        Value: !GetAtt GitHubMainRole.Arn
    GitHubProdRoleArn:
        Description: role-to-assume for the prod deploy job
        Value: !GetAtt GitHubProdRole.Arn
