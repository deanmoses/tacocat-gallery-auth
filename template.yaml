# -----------------------------------------------------------------------------
# This is a AWS Serverless Application Model (SAM) template
# It defines the "stack" of AWS resources needed to run the SAM app
# -----------------------------------------------------------------------------
AWSTemplateFormatVersion: 2010-09-09

# -----------------------------------------------------------------------------
# This particular template defines the authentication API for Tacocat Gallery
# -----------------------------------------------------------------------------
Description: Tacocat gallery authentication API

# -----------------------------------------------------------------------------
# This file is written in SAM syntax, and gets transformed and expanded into a
# CloudFormation template.  The CloudFormation template is what actually gets
# deployed.  The main point is that SAM syntax is much simpler, with a lot less
# boilerplate around declaring resources like Lambda functions and their
# accompanying execution roles.
# -----------------------------------------------------------------------------
Transform: AWS::Serverless-2016-10-31

# -----------------------------------------------------------------------------
# Parameters that can be specified when deploying this template
# This is the only way to define constants for use elsewhere in the template
# -----------------------------------------------------------------------------
Parameters:
  Env:
    Description: Environment for which the infrastructure will be deployed
    Type: String
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: Must be either 'dev' or 'prod'
  GalleryAppDomain:
    Description: Domain of the Tacocat photo gallery web app
    Type: String
    AllowedValues:
      - staging-pix.tacocat.com
      - pix.tacocat.com
    ConstraintDescription: Must be either 'staging-pix.tacocat.com' or 'pix.tacocat.com'
  DomainCertificateArn:
    Description: ARN of the ACM certificate for the GalleryAppDomain domain
    Type: String
    AllowedValues:
      - arn:aws:acm:us-east-1:010410881828:certificate/092ab57c-f87d-4c44-a72c-63cfbbb55800 # staging-pix.tacocat.com
      - arn:aws:acm:us-east-1:010410881828:certificate/e142cda0-96db-4651-92fd-35dd9a52e9a2 # pix.tacocat.com
  CognitoUserPoolID:
    Description: ID of Cognito user pool
    Type: String
  CognitoBaseURI:
    Description: Root URL of the user pool
    Type: String
  CognitoClientID:
    Description: ID of the app client created in AWS Cognito.  It's found in AWS Cognito under App client information > Client ID
    Type: String
  CognitoLogoutCallbackURI:
    Description: Path within the gallery web app (GalleryAppBaseURI) to send users after Cognito logs them out.
    Type: String
    Default: /

# -----------------------------------------------------------------------------
# Conditions
# -----------------------------------------------------------------------------
Conditions:
  IsProd: !Equals [!Ref Env, prod]

# ------------------------------------------------------------------------------
# Configuration inheritable by all Lambda functions and other types of Resources
# ------------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    # MemorySize is how Lambda sells vCPU -- 1769MB is one full vCPU, and it scales
    # linearly below that. The 128MB default is ~0.07 vCPU, which throttles init and
    # request handling alike. 1024MB (~0.6 vCPU) is the floor for anything doing real
    # work. Billing is GB-seconds, so raising memory is close to free where duration
    # falls proportionally -- but that stops holding once a function saturates its
    # cores, so measure before raising it.
    MemorySize: 1024
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON
      # One log group for the whole stack so retention is set once, as code.
      # Lambda names each stream with the function name, so filtering still works.
      LogGroup: !Ref AuthLogGroup
    Environment:
      Variables:
        GalleryAppDomain: !Ref GalleryAppDomain
        AuthAppDomain: !Sub auth.${GalleryAppDomain}
        GalleryAppBaseURI: !Sub https://${GalleryAppDomain}
        CognitoUserPoolID: !Ref CognitoUserPoolID
        CognitoBaseURI: !Ref CognitoBaseURI
        CognitoClientID: !Ref CognitoClientID
        CognitoLogoutCallbackURI: !Ref CognitoLogoutCallbackURI
        CognitoClientSecret: "{{resolve:secretsmanager:Tacocat/Gallery/Authentication:SecretString:TacocatGalleryCognitoClientSecret}}"
  Api:
    Name: !Sub Tacocat Gallery Auth API - ${Env}
    Domain:
      DomainName: !Sub auth.${GalleryAppDomain}
      CertificateArn: !Ref DomainCertificateArn
    # Needs the account-level CloudWatch role for API Gateway, see infra/README.md.
    # Every value is quoted: a variable API Gateway can't fill renders as "-",
    # which is only valid JSON inside a string.
    AccessLogSetting:
      DestinationArn: !GetAtt ApiAccessLogGroup.Arn
      Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","errorMessage":"$context.error.message"}'
    Cors:
      AllowMethods: "'GET,OPTIONS'"
      AllowHeaders: "'content-type,origin'"
      AllowOrigin: !Sub "'https://${GalleryAppDomain}'"
      AllowCredentials: true

# -----------------------------------------------------------------------------
# Resources are the actual AWS systems that will be provisioned
# -----------------------------------------------------------------------------
Resources:

  # CloudWatch log group shared by every Lambda in the stack
  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProd, Retain, Delete] # don't delete in prod
    UpdateReplacePolicy: !If [IsProd, Retain, Delete] # don't delete in prod
    Properties:
      LogGroupName: !Sub tacocat-gallery-auth/${Env} # Lambda refuses custom log groups that start with aws/
      RetentionInDays: !If [IsProd, 90, 30]

  # API Gateway access log, one record per request. Its own group rather than the
  # Lambda one: API Gateway writes flat JSON, while Lambda nests records under
  # `message`, and mixing the two shapes makes Logs Insights queries awkward.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProd, Retain, Delete] # don't delete in prod
    UpdateReplacePolicy: !If [IsProd, Retain, Delete] # don't delete in prod
    Properties:
      LogGroupName: !Sub tacocat-gallery-auth/${Env}/api-access
      RetentionInDays: !If [IsProd, 90, 30]

  # Lambda for retrieving authentication status
  AuthStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AuthStatus
      Description: HTTP GET method to get authentication status
      Handler: authStatus.handler
      CodeUri: src/handlers/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - authStatus.ts

  # Lambda for redirecting to the AWS Cognito login page
  RedirectToCognitoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-RedirectToCognito
      Description: HTTP GET method for redirecting to the AWS Cognito login page
      Handler: redirectToCognito.handler
      CodeUri: src/handlers/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /login
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - redirectToCognito.ts

  # Lambda for handling the login callback from the AWS Cognito login page
  LoginCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-LoginCallback
      Description: Handles the login callback from the AWS Cognito login page
      Handler: loginCallback.handler
      CodeUri: src/handlers/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /login_callback
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - loginCallback.ts

  # Lambda for logging the user out
  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Logout
      Description: Log the user out
      Handler: logout.handler
      CodeUri: src/handlers/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /logout
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - logout.ts

# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
Outputs:
  AwsApi:
    Description: AWS API URL (not used)
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/

  Api:
      Description: API URL (use this)
      Value: !Sub https://auth.${GalleryAppDomain}
