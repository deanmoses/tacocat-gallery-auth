name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '*.md'
            - 'LICENSE'
            - '.gitignore'
            - 'docs/**'
    pull_request:
        branches: [main]
        paths-ignore:
            - '*.md'
            - 'LICENSE'
            - '.gitignore'
            - 'docs/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-validate:
        uses: ./.github/workflows/build-and-validate.yml
        permissions:
            contents: read
            id-token: write # a called workflow can hold at most the permissions the caller grants

    deploy:
        needs: build-and-validate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # the repo root, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
              with:
                  role-to-assume: arn:aws:iam::010410881828:role/tacocat-gallery-auth-cicd-github-main
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
