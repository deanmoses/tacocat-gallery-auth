# The main CI workflow ignores markdown paths, so a docs-only change skips it
# entirely. Linting docs there instead would mean a typo fix triggering a
# staging deploy, so markdown gets this separate, build-free workflow.
name: Lint docs

on:
    push:
        branches: [main]
        paths:
            - '**.md'
            - '.markdownlint.json'
            - '.markdownlint-cli2.jsonc'
    pull_request:
        branches: [main]
        paths:
            - '**.md'
            - '.markdownlint.json'
            - '.markdownlint-cli2.jsonc'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    markdownlint:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint markdown
              run: npm run lint:md
