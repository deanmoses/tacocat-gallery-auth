name: Build and Validate

on:
    workflow_call:
        # Makes this workflow callable from other workflows

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # the repo root, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Lint markdown
              run: npm run lint:md

            - name: Lint shell scripts
              # shellcheck is preinstalled on ubuntu-latest runners
              run: npm run lint:shell

            - name: Lint GitHub Actions workflows
              uses: docker://rhysd/actionlint:1.7.12
              with:
                  args: -color

            - name: Type check
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: Lint CloudFormation template
              run: npm run lint:cfn

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Pull requests get a role that can only create (never execute) a change set on dev;
              # runs on main get the deploy role. Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::010410881828:role/tacocat-gallery-auth-cicd-github-pr' || 'arn:aws:iam::010410881828:role/tacocat-gallery-auth-cicd-github-main' }}
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Validate changeset (dry-run)
              run: |
                  set -o pipefail
                  sam deploy --no-execute-changeset --no-fail-on-empty-changeset 2>&1 | tee /tmp/changeset.log
                  # Check for changeset creation failure (circular deps, invalid resources, etc.)
                  if grep -q "Failed to create changeset" /tmp/changeset.log; then
                    echo "::error::Changeset validation failed"
                    exit 1
                  fi
