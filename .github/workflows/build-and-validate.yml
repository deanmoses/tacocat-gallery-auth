name: Build and Validate

on:
    workflow_call:
        inputs:
            dry-run-changeset:
                description: Create, but never execute, a change set against the dev stack to prove the template deploys
                type: boolean
                default: true

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # gitleaks scans the whole history, not just the tip

            # Third-party tools are downloaded from pinned releases and checksummed
            # rather than pulled from their GitHub Actions, so a compromised upstream
            # can't reach the AWS credentials this job assumes later.
            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: |
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSL -o "$archive" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
                  echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
                  tar -xzf "$archive" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks
                  rm -f "$archive" gitleaks

            - name: Scan for secrets
              run: gitleaks git --no-banner --redact

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Lint markdown
              run: npm run lint:md

            - name: Lint shell scripts
              # shellcheck is preinstalled on ubuntu-latest runners
              run: npm run lint:shell

            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL -o "$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
                  tar -xzf "$archive" actionlint
                  sudo install actionlint /usr/local/bin/actionlint
                  rm -f "$archive" actionlint

            - name: Lint GitHub Actions workflows
              run: npm run lint:actions -- -color

            - name: Type check
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
              with:
                  use-installer: true

            - name: Lint CloudFormation template
              run: npm run lint:cfn

            - name: SAM build
              # Through npm so the esbuild that package-lock.json pins is first on PATH
              run: npm run build

            - name: Configure AWS credentials
              if: ${{ inputs.dry-run-changeset }}
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Pull requests get a role that can only create (never execute) a change set on dev;
              # runs on main get the deploy role. Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
              with:
                  role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::010410881828:role/tacocat-gallery-auth-cicd-github-pr' || 'arn:aws:iam::010410881828:role/tacocat-gallery-auth-cicd-github-main' }}
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Validate changeset (dry-run)
              if: ${{ inputs.dry-run-changeset }}
              run: |
                  set -o pipefail
                  sam deploy --no-execute-changeset --no-fail-on-empty-changeset 2>&1 | tee /tmp/changeset.log
                  # Check for changeset creation failure (circular deps, invalid resources, etc.)
                  if grep -q "Failed to create changeset" /tmp/changeset.log; then
                    echo "::error::Changeset validation failed"
                    exit 1
                  fi
